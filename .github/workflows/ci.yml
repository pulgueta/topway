name: CI

on: pull_request

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test TopwayCore
        run: swift test --package-path Packages/TopwayCore
      - name: Build the app
        run: xcodebuild -project topway.xcodeproj -scheme topway -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build the direct app
        run: xcodebuild -project topway.xcodeproj -scheme topway-direct -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Check that the App Store build has no Sparkle
        run: scripts/check-app-store-build.sh
      - name: Check format
        run: swift format lint --recursive --strict topway topway-direct Packages

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the website dependencies
        run: npm ci
      - name: Build the website and check dist
        run: npm run build
